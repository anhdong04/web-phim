name: CI Secure Multi-user Builder

on:
  push:
    branches:
      - feat/secure-multiuser-builder
      - fix/hhtq-direct-player
      - fix/hhtq-exact-resolver
      - fix/hhtq-hh4k-fallback
      - main
    paths:
      - 'multiuser_secure.js'
      - 'tests/multiuser_secure.test.js'
      - 'hhtq_provider.js'
      - 'hhtq_browser_patch.js'
      - 'hhtq_exact_patch.js'
      - 'hhtq_relay.js'
      - 'hhtq_hh4k_fallback.js'
      - 'hhtq_bridge.js'
      - 'tests/hhtq_provider.test.js'
      - 'tests/hhtq_exact_patch.test.js'
      - 'tests/hhtq_hh4k_fallback.test.js'
      - 'v641_patch.js'
      - 'addon_v650.js'
      - 'package.json'
      - '.github/workflows/ci-multiuser.yml'
  pull_request:
    paths:
      - 'multiuser_secure.js'
      - 'tests/multiuser_secure.test.js'
      - 'hhtq_provider.js'
      - 'hhtq_browser_patch.js'
      - 'hhtq_exact_patch.js'
      - 'hhtq_relay.js'
      - 'hhtq_hh4k_fallback.js'
      - 'hhtq_bridge.js'
      - 'tests/hhtq_provider.test.js'
      - 'tests/hhtq_exact_patch.test.js'
      - 'tests/hhtq_hh4k_fallback.test.js'
      - 'v641_patch.js'
      - 'addon_v650.js'
      - 'package.json'
      - '.github/workflows/ci-multiuser.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
