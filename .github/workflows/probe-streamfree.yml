name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Streamfree decoder bootstrap
        shell: bash
        run: |
          set -e
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          ref='https://streamfree.vip/embed/v/xbwJ5CT4'
          curl -L -sS --max-time 25 -A "$ua" -e "$ref" 'https://streamfree.vip/public/static/app.bb288bfe.js' -o /tmp/app.js
          python3 <<'PY'
          s=open('/tmp/app.js','r',encoding='utf-8',errors='ignore').read()
          print('LEN',len(s))
          print('\n===== FIRST 14000 =====\n',s[:14000])
          for term in ['function a0_0x34f2','a0_0x34f2=function','var _0x6b8455','function _0xc36d41','_0x6b8455[','-3']:
              print('\n===== FIND',term,'=====')
              start=0;c=0
              while c<8:
                  i=s.find(term,start)
                  if i<0:break
                  print('AT',i,'\n',s[max(0,i-3000):min(len(s),i+7000)])
                  start=i+len(term);c+=1
          PY
