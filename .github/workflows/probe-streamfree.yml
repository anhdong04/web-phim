name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and Chromium
        shell: bash
        run: |
          npm install --omit=dev
          sudo apt-get update -qq
          sudo apt-get install -y chromium >/dev/null
      - name: Resolve HHTQ watch page to HLS
        shell: bash
        env:
          HHKUNGFU_HLS_TIMEOUT_MS: '45000'
          HHKUNGFU_HLS_ATTEMPTS: '1'
          HHKUNGFU_CHROMIUM_PATH: '/usr/bin/chromium'
        run: |
          node <<'NODE'
          const { resolveHls } = require('./v647_hhkungfu_resolver');
          (async()=>{
            const watch='https://hhtq.sh/tu-tien/tien-nghich/tap-154.html';
            const hls=await resolveHls(watch,'hh4k-hhtq-tien-nghich-154');
            console.log('DIRECT_HLS',hls);
            if(!hls || !/\.m3u8/i.test(hls)) throw new Error('No direct HLS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
