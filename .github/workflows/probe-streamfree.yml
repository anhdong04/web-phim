name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe HHTQ mirrors
        shell: bash
        run: |
          set -e
          node <<'NODE'
          const { HH4KProvider } = require('./hh4k_provider');
          const domains=['https://hhtq.ee','https://hhtq.st','https://hhtq.sh','https://hhtq.hair'];
          (async()=>{
            for(const base of domains){
              console.log('\n===== '+base+' =====');
              try{
                const p=new HH4KProvider({mainUrl:base,timeoutMs:15000,cacheTtlMs:30000});
                const page=await p.fetchCategoryPage('moi-cap-nhat',1);
                console.log('CAT',page.items.length,page.items.slice(0,2).map(x=>x.title));
                if(!page.items.length) continue;
                const d=await p.loadDetail(page.items[0].detailUrl);
                console.log('DETAIL',d.title,'EPS',d.episodes.length,d.episodes[0]?.watchUrl);
                if(!d.episodes.length) continue;
                const links=await p.resolveStreamLinks(d.episodes[0].watchUrl);
                console.log('PLAYERS',links.slice(0,8).map(x=>({name:x.serverName,embed:x.embedUrl,url:x.url})));
              }catch(e){console.log('ERR',String(e.message||e));}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
