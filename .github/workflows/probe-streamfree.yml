name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --omit=dev
      - name: Capture Streamfree player assets
        shell: bash
        run: |
          set -o pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || true)"
          test -n "$BROWSER"
          node <<'NODE' 2>&1 | tee streamfree-trace.log
          const fs=require('node:fs');
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36';
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setUserAgent(UA);
            page.on('console',msg=>console.log('CONSOLE',msg.type(),msg.text().slice(0,2000)));
            page.on('pageerror',e=>console.log('PAGEERROR',String(e?.stack||e).slice(0,4000)));
            await page.setRequestInterception(true);
            let patched=false; const media=[];
            page.on('request',async req=>{
              const u=req.url();
              try{
                if(/streamfree\.vip\/public\/static\/app\.[a-f0-9]+\.js/i.test(u)){
                  const r=await fetch(u,{headers:{...req.headers(),'user-agent':UA,'referer':'https://streamfree.vip/embed/v/xbwJ5CT4'}});
                  let body=await r.text();
                  fs.writeFileSync('streamfree-app-original.js',body);
                  const re=/var (_0x[a-f0-9]+)=new (_0x[a-f0-9]+)\((_0x[a-f0-9]+)\);/g;
                  for(const m of body.matchAll(re)){
                    const v=m[1], esc=v.replace(/[$]/g,'\\$&');
                    const co=(body.match(new RegExp(esc+"\\['co'\\]\\(\\)",'g'))||[]).length;
                    const al=(body.match(new RegExp(esc+"\\['al'\\]\\(",'g'))||[]).length;
                    if(co===2&&al===1){body=body.replace(m[0],`var ${v}={co:function(){return Promise.resolve(false);},al:function(){return void 0;}};`);patched=true;console.log('PATCHED',v);break;}
                  }
                  fs.writeFileSync('streamfree-app-patched.js',body);
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body});
                }
                if(/streamfree\.vip\/public\/static\/31\.[a-f0-9]+\.js/i.test(u)){
                  const r=await fetch(u,{headers:{...req.headers(),'user-agent':UA,'referer':'https://streamfree.vip/embed/v/xbwJ5CT4'}});
                  const body=await r.text();
                  fs.writeFileSync('streamfree-chunk31.js',body);
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body});
                }
                if(/\.m3u8(?:$|[?#])/i.test(u)||/\.mp4(?:$|[?#])/i.test(u)){media.push(u);console.log('MEDIA_REQ',u);}
                return req.continue();
              }catch(e){console.log('INTERCEPT_ERR',u,e.message); try{return req.continue();}catch{}}
            });
            await page.goto('https://hhtq.sh/tu-tien/tien-nghich/tap-154.html',{waitUntil:'domcontentloaded',timeout:45000});
            for(let i=0;i<30;i++) await sleep(500);
            for(const f of page.frames()){
              if(/streamfree/i.test(f.url())){
                const html=await f.content().catch(()=> '');
                fs.writeFileSync('streamfree-embed-rendered.html',html);
                const data=await f.evaluate(()=>{const el=document.querySelector('#hrm-player');return el?Object.fromEntries([...el.attributes].map(a=>[a.name,a.value])):{};}).catch(()=>({}));
                fs.writeFileSync('streamfree-player-data.json',JSON.stringify(data,null,2));
                console.log('PLAYER_DATA',JSON.stringify(data));
              }
            }
            console.log('SUMMARY patched=',patched,'media=',media);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload Streamfree trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamfree-assets
          path: |
            streamfree-trace.log
            streamfree-app-original.js
            streamfree-app-patched.js
            streamfree-chunk31.js
            streamfree-embed-rendered.html
            streamfree-player-data.json
          retention-days: 1
