name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Locate anti-devtools detector object
        shell: bash
        run: |
          set -e
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          ref='https://streamfree.vip/embed/v/xbwJ5CT4'
          curl -L -sS --max-time 25 -A "$ua" -e "$ref" 'https://streamfree.vip/public/static/app.bb288bfe.js' -o /tmp/app.js
          python3 <<'PY'
          s=open('/tmp/app.js','r',encoding='utf-8',errors='ignore').read()
          terms=['_0xfcc099=','var _0xfcc099','let _0xfcc099','const _0xfcc099',"_0xfcc099['co']","_0xfcc099['al']",'_0xfcc099.co','_0xfcc099.al']
          for term in terms:
              print('\n===== '+term+' =====')
              start=0;c=0
              while c<20:
                  i=s.find(term,start)
                  if i<0: break
                  print('AT',i)
                  print(s[max(0,i-5000):min(len(s),i+9000)])
                  print('\n---')
                  start=i+len(term);c+=1
              print('COUNT',c)
          PY
