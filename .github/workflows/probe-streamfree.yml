name: Verify HH4K Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-streamfree.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check HH4K production files
        run: |
          node --check hh4k_browser_patch.js
          node --check hh4k_bridge.js
          node --check addon_v650.js
      - name: Wait for Render HH4K v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kkphim-nuvio-addon.onrender.com'
          for i in $(seq 1 36); do
            BODY="$(curl -fsS --max-time 25 "$BASE/hh4k" || true)"
            echo "attempt=$i body=$BODY"
            if echo "$BODY" | grep -q '"version":"1.3.0"'; then
              echo 'HH4K v1.3.0 is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Render did not expose HH4K v1.3.0 within the verification window.' >&2
          exit 1
      - name: Verify live catalog meta and stream endpoint
        shell: bash
        run: |
          node <<'NODE'
          const base='https://kkphim-nuvio-addon.onrender.com/hh4k';
          async function get(path, timeout=90000){
            const ac=new AbortController();
            const t=setTimeout(()=>ac.abort(), timeout);
            try{
              const r=await fetch(base+path,{signal:ac.signal,headers:{accept:'application/json'}});
              const text=await r.text();
              if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${text.slice(0,300)}`);
              return JSON.parse(text);
            } finally { clearTimeout(t); }
          }
          (async()=>{
            const root=await get('');
            const manifest=await get('/manifest.json');
            const diag=await get('/diag');
            if(root.version!=='1.3.0'||manifest.version!=='1.3.0') throw new Error('Unexpected deployed HH4K version');
            if(root.resolver!=='browser-hls-guarded'||diag.resolver!=='browser-hls-guarded') throw new Error('Guarded resolver is not active');
            const cat=await get('/catalog/series/hh4k.json');
            const first=cat?.metas?.[0];
            if(!first?.id) throw new Error('Live HH4K catalog is empty');
            const meta=await get('/meta/series/'+encodeURIComponent(first.id)+'.json');
            const video=meta?.meta?.videos?.[0];
            if(!video?.id) throw new Error('Live HH4K metadata has no episodes');
            const streams=await get('/stream/series/'+encodeURIComponent(video.id)+'.json',120000);
            const list=Array.isArray(streams?.streams)?streams.streams:[];
            const direct=list.filter(x=>x&&x.url).length;
            const external=list.filter(x=>x&&x.externalUrl).length;
            if(!list.length) throw new Error('Live HH4K stream endpoint returned no streams');
            if(direct>0&&external>0) throw new Error('Direct and browser fallback streams were mixed');
            console.log(JSON.stringify({
              version:root.version,
              resolver:root.resolver,
              diagOk:diag.ok,
              firstTitle:first.name,
              firstEpisode:video.title,
              streamCount:list.length,
              direct,
              external,
              mode:direct>0?'direct-hls':'external-fallback'
            },null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
