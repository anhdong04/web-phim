name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --omit=dev
      - name: Capture direct HLS with fixed detector shim
        shell: bash
        run: |
          set -o pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || true)"
          test -n "$BROWSER"
          node <<'NODE' 2>&1 | tee streamfree-hls.log
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36';
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setUserAgent(UA);
            page.on('console',msg=>console.log('CONSOLE',msg.type(),msg.text().slice(0,3000)));
            page.on('pageerror',e=>console.log('PAGEERROR',String(e?.stack||e).slice(0,5000)));
            await page.setRequestInterception(true);
            const media=[];
            page.on('request',async req=>{
              const u=req.url();
              try{
                if(/streamfree\.vip\/public\/static\/app\.[a-f0-9]+\.js/i.test(u)){
                  const r=await fetch(u,{headers:{...req.headers(),'user-agent':UA,'referer':'https://streamfree.vip/embed/v/xbwJ5CT4'}});
                  let body=await r.text();
                  const re=/var (_0x[a-f0-9]+)=new (_0x[a-f0-9]+)\((_0x[a-f0-9]+)\);/g;
                  let patched=false;
                  for(const m of body.matchAll(re)){
                    const v=m[1], esc=v.replace(/[$]/g,'\\$&');
                    const co=(body.match(new RegExp(esc+"\\['co'\\]\\(\\)",'g'))||[]).length;
                    const al=(body.match(new RegExp(esc+"\\['al'\\]\\(",'g'))||[]).length;
                    const l=(body.match(new RegExp(esc+"\\['l'\\]\\(\\)",'g'))||[]).length;
                    if(co===2&&al===1&&l===1){
                      body=body.replace(m[0],`var ${v}={l:function(){},co:function(){return Promise.resolve(false);},al:function(){}};`);
                      patched=true; console.log('PATCHED_DETECTOR',v,'co',co,'al',al,'l',l); break;
                    }
                  }
                  if(!patched) console.log('PATCH_MISS');
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body});
                }
                if(/\/reportaproblem/i.test(u)) console.log('REPORT_REQ',req.method(),u,req.postData()||'');
                if(/streamfree|\/hls\/|\.m3u8(?:$|[?#])|\.mp4(?:$|[?#])/i.test(u)) console.log('NET_REQ',req.resourceType(),req.method(),u);
                if(/\.m3u8(?:$|[?#])/i.test(u)||/\.mp4(?:$|[?#])/i.test(u)){media.push({url:u,headers:req.headers()});console.log('MEDIA_REQ',u,JSON.stringify(req.headers()));}
                return req.continue();
              }catch(e){console.log('INTERCEPT_ERR',u,e.message); try{return req.continue();}catch{}}
            });
            page.on('response',res=>{const u=res.url(); if(/streamfree|\/hls\/|\.m3u8|reportaproblem/i.test(u)) console.log('RES',res.status(),u);});
            await page.goto('https://hhtq.sh/tu-tien/tien-nghich/tap-154.html',{waitUntil:'domcontentloaded',timeout:45000});
            for(let i=0;i<50&&!media.length;i++) await sleep(400);
            console.log('FRAMES',page.frames().map(f=>f.url()));
            console.log('MEDIA',JSON.stringify(media));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload HLS trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamfree-hls
          path: streamfree-hls.log
          retention-days: 1
