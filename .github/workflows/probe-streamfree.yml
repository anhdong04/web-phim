name: Probe Streamfree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Streamfree anti-devtools scripts
        shell: bash
        run: |
          set -e
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          ref='https://streamfree.vip/embed/v/xbwJ5CT4'
          for u in \
            'https://streamfree.vip/public/static/app.bb288bfe.js' \
            'https://streamfree.vip/public/static/31.00eb8550.js' \
            'https://streamfree.vip/public/js/jwplayer.2ba7a03f.js'; do
            f="/tmp/$(basename "$u")"
            code=$(curl -L -sS -o "$f" -w '%{http_code}' --max-time 25 -A "$ua" -e "$ref" "$u")
            echo "FETCH $code $u bytes=$(wc -c <"$f")"
          done
          python3 <<'PY'
          from pathlib import Path
          terms=['(-3)','-3','developer tools','devtools','outerWidth','outerHeight','debugger','console.table','console.clear','Firebug','toString','performance.now','setInterval','innerWidth']
          for p in Path('/tmp').glob('*.js'):
              try:s=p.read_text('utf-8',errors='ignore')
              except:continue
              print('\n===== FILE',p.name,'=====',len(s))
              low=s.lower()
              shown=set()
              for term in terms:
                  start=0
                  while True:
                      i=low.find(term.lower(),start)
                      if i<0:break
                      a=max(0,i-1200);b=min(len(s),i+1800)
                      key=(a//500,b//500)
                      if key not in shown:
                          print('\n--- TERM',term,'AT',i,'---\n',s[a:b])
                          shown.add(key)
                      start=i+len(term)
                      if len(shown)>30:break
                  if len(shown)>30:break
          PY
