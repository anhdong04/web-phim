name: Probe Streamfree

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --omit=dev
      - name: Probe latest HH4K episode in headful Chrome
        shell: bash
        run: |
          set -o pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || true)"
          test -n "$BROWSER"
          command -v xvfb-run
          xvfb-run -a node <<'NODE' 2>&1 | tee hh4k-headful-latest.log
          const puppeteer=require('puppeteer-core');
          const {HH4KProvider}=require('./hh4k_provider');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function patchApp(body){
            const re=/var (_0x[a-f0-9]+)=new (_0x[a-f0-9]+)\((_0x[a-f0-9]+)\);/g;
            for(const m of body.matchAll(re)){
              const v=m[1],esc=v.replace(/[$]/g,'\\$&');
              const co=(body.match(new RegExp(esc+"\\['co'\\]\\(\\)",'g'))||[]).length;
              const al=(body.match(new RegExp(esc+"\\['al'\\]\\(",'g'))||[]).length;
              const l=(body.match(new RegExp(esc+"\\['l'\\]\\(\\)",'g'))||[]).length;
              if(co===2&&al===1&&l===1)return body.replace(m[0],`${m[0]}${v}['co']=function(){return Promise.resolve(false);};${v}['al']=function(){};`);
            }
            return body;
          }
          (async()=>{
            const provider=new HH4KProvider({mainUrl:'https://hhtq.sh',timeoutMs:20000,cacheTtlMs:30000});
            const cat=await provider.fetchCategoryPage('moi-cap-nhat',1);
            let picked=null;
            for(const item of cat.items.slice(0,8)){
              try{const d=await provider.loadDetail(item.detailUrl);if(d.episodes?.length){picked={item,detail:d,ep:d.episodes[0]};break;}}catch{}
            }
            if(!picked)throw new Error('No current HH4K episode');
            const WATCH=picked.ep.watchUrl;
            console.log('LATEST_PICK',JSON.stringify({title:picked.detail.title,watchUrl:WATCH,episode:picked.ep.name}));
            const browser=await puppeteer.launch({headless:false,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled','--autoplay-policy=no-user-gesture-required','--window-size=1365,768']});
            const page=await browser.newPage();
            await page.evaluateOnNewDocument(()=>{
              try{Object.defineProperty(navigator,'webdriver',{get:()=>undefined});}catch{}
              try{Object.defineProperty(navigator,'languages',{get:()=>['vi-VN','vi','en-US','en']});}catch{}
              try{if(!window.chrome)window.chrome={runtime:{}};}catch{}
            });
            await page.setRequestInterception(true);
            let hlsUrl='',status=0,bodyHead='',headers={};
            page.on('request',async req=>{
              const u=req.url();
              try{
                if(/streamfree\.vip\/public\/static\/app\.[a-f0-9]+\.js/i.test(u)){
                  const r=await fetch(u,{headers:{...req.headers(),referer:'https://streamfree.vip/'}});
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body:patchApp(await r.text())});
                }
                if(/\/hls\/.*\.m3u8(?:$|[?#])/i.test(u)){hlsUrl=u;headers=req.headers();console.log('HLS_REQ',u);}
                return req.continue();
              }catch{try{return req.continue();}catch{}}
            });
            page.on('response',async res=>{
              if(/\/hls\/.*\.m3u8(?:$|[?#])/i.test(res.url())){status=res.status();try{bodyHead=(await res.text()).slice(0,1000);}catch{}console.log('HLS_RESPONSE',status,JSON.stringify(bodyHead));}
            });
            await page.goto(WATCH,{waitUntil:'domcontentloaded',timeout:45000});
            for(let i=0;i<80&&(!hlsUrl||!status);i++)await sleep(250);
            const frames=[];
            for(const f of page.frames())if(/streamfree/i.test(f.url())){const x=await f.evaluate(()=>({url:location.href,ua:navigator.userAgent,playlist:typeof jwplayer==='function'?jwplayer().getPlaylist?.():null,state:typeof jwplayer==='function'?jwplayer().getState?.():null})).catch(e=>({url:f.url(),err:String(e)}));frames.push(x);}
            console.log('FRAME_STATE',JSON.stringify(frames).slice(0,12000));
            console.log('RESULT',JSON.stringify({title:picked.detail.title,watchUrl:WATCH,hlsUrl,status,bodyHead,headers}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh4k-headful-latest
          path: hh4k-headful-latest.log
          retention-days: 1
