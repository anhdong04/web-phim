name: Inspect Render Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-streamfree.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Render routes
        shell: bash
        run: |
          BASE='https://kkphim-nuvio-addon.onrender.com'
          for PATHNAME in '/' '/manifest.json' '/vn/manifest.json' '/hhkungfu/manifest.json' '/hh4k' '/hh4k/manifest.json'; do
            echo "===== $PATHNAME ====="
            curl -sS --max-time 30 -D - "$BASE$PATHNAME" -o /tmp/body || true
            echo '--- body ---'
            head -c 1600 /tmp/body 2>/dev/null || true
            echo
            echo
          done
