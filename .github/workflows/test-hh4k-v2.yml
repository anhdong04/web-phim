name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WordPress endpoints
        shell: bash
        run: |
          set +e
          urls=(
            'https://phimhhtq.com/wp-json/'
            'https://phimhhtq.com/wp-json/wp/v2/search?search=phim&per_page=3'
            'https://phimhhtq.com/wp-json/wp/v2/posts?per_page=3'
            'https://phimhhtq.com/?rest_route=/wp/v2/posts&per_page=3'
            'https://phimhhtq.com/feed/'
            'https://phimhhtq.com/wp-sitemap.xml'
            'https://phimhhtq.com/wp-sitemap-posts-post-1.xml'
            'https://phimhhtq.com/wp-admin/admin-ajax.php'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L -sS --max-time 20 -A 'Mozilla/5.0' -H 'Accept: application/json,text/xml,text/html,*/*' -D /tmp/h "$u" -o /tmp/b
            head -n 10 /tmp/h
            echo "bytes=$(wc -c </tmp/b)"
            head -c 900 /tmp/b
            echo
          done
