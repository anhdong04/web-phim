name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HHTQ mirrors
        shell: bash
        run: |
          set +e
          urls=(
            'https://hhtq.sh/'
            'https://hhtq.app/'
            'https://hoathinhtrungquoc.vip/'
            'https://hhninja2.fun/'
            'https://phimgenz.com/'
            'https://hhtq.dog/'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L -sS --max-time 20 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' -D /tmp/h "$u" -o /tmp/b
            code=$(awk '/^HTTP/{c=$2} END{print c}' /tmp/h)
            echo "status=$code bytes=$(wc -c </tmp/b)"
            grep -Eio 'Phàm Nhân|Tiên Nghịch|Mới Cập Nhật|halim|episode|m3u8|Just a moment|security verification' /tmp/b | head -n 20
            head -c 700 /tmp/b
            echo
          done
