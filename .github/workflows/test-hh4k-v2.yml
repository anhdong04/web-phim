name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect hhtq.sh player
        shell: bash
        run: |
          set +e
          u='https://hhtq.sh/tu-tien/tien-nghich/tap-154.html'
          curl -L -sS --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' "$u" -o /tmp/page
          echo "bytes=$(wc -c </tmp/page)"
          echo '=== URLs / player markers ==='
          grep -Eio 'https?:[^"'"'"' <>\\]+' /tmp/page | grep -Ei 'm3u8|mp4|embed|player|stream|video|ajax|api' | head -n 80
          echo '=== relevant lines ==='
          grep -Ein 'm3u8|\.mp4|iframe|data-(src|url|file|embed)|jwplayer|halim|ajax|player|source|video' /tmp/page | head -n 160
