name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HH4K provider
        shell: bash
        run: |
          node --check hh4k_provider.js
          node --check hh4k_bridge.js
          node <<'NODE'
          const { HH4KProvider } = require('./hh4k_provider');
          (async()=>{
            const p=new HH4KProvider({mainUrl:'https://hhtq.sh',timeoutMs:15000});
            const page=await p.fetchCategoryPage('moi-cap-nhat',1);
            console.log('CATALOG',page.items.length,page.items.slice(0,3).map(x=>x.title));
            if(page.items.length<10) throw new Error('catalog too small');
            const d=await p.loadDetail(page.items[0].detailUrl);
            console.log('META',d.title,'EPISODES',d.episodes.length,d.episodes[0]);
            if(!d.episodes.length) throw new Error('no episodes');
            const links=await p.resolveStreamLinks(d.episodes[0].watchUrl);
            console.log('PLAYERS',links.length,links.slice(0,4).map(x=>[x.serverName,x.externalUrl]));
            if(!links.length) throw new Error('no player sources');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
