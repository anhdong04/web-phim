name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --omit=dev
      - name: Resolve HH4K Streamfree HLS
        shell: bash
        env:
          HHKUNGFU_HLS_TIMEOUT_MS: '30000'
          HHKUNGFU_HLS_ATTEMPTS: '1'
        run: |
          node <<'NODE'
          const { resolveHls } = require('./v647_hhkungfu_resolver');
          (async()=>{
            const embed='https://streamfree.vip/embed/v/YKDs8Q0X';
            const hls=await resolveHls(embed,'hh4k-test');
            console.log('HLS',hls);
            if(!hls) throw new Error('no HLS');
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
