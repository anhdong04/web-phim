name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test hhtq.sh with provider
        shell: bash
        run: |
          node --check hh4k_provider.js
          node <<'NODE'
          const { HH4KProvider } = require('./hh4k_provider');
          (async () => {
            const p = new HH4KProvider({ mainUrl: 'https://hhtq.sh', timeoutMs: 15000 });
            for (const path of ['moi-cap-nhat','']) {
              try {
                const page = await p.fetchCategoryPage(path || 'moi-cap-nhat', 1);
                console.log('PATH', path || '/', 'ITEMS', page.items.length);
                console.log('SAMPLE', JSON.stringify(page.items.slice(0,3), null, 2));
                if (!page.items.length) continue;
                const d = await p.loadDetail(page.items[0].detailUrl);
                console.log('DETAIL', d.title, 'EPS', d.episodes.length, d.detailUrl);
                console.log('EPSAMPLE', JSON.stringify(d.episodes.slice(0,3), null, 2));
                if (d.episodes.length) {
                  try {
                    const links = await p.resolveStreamLinks(d.episodes[0].watchUrl);
                    console.log('STREAMS', JSON.stringify(links.slice(0,3), null, 2));
                  } catch(e) { console.log('STREAM_ERR', e.message); }
                }
                break;
              } catch(e) { console.log('PATH_ERR', path, e.message); }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
