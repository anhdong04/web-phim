name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PhimHHTQ fetch routes
        shell: bash
        run: |
          set +e
          urls=(
            'https://www.phimhhtq.com/moi-cap-nhat/'
            'https://r.jina.ai/http://https://phimhhtq.com/moi-cap-nhat/'
            'https://api.allorigins.win/raw?url=https%3A%2F%2Fphimhhtq.com%2Fmoi-cap-nhat%2F'
            'https://corsproxy.io/?url=https%3A%2F%2Fphimhhtq.com%2Fmoi-cap-nhat%2F'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L -sS --max-time 35 -D /tmp/h "$u" -o /tmp/b
            head -n 12 /tmp/h
            echo "bytes=$(wc -c </tmp/b)"
            head -c 1200 /tmp/b
            echo
          done
