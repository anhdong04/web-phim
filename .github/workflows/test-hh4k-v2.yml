name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and verify manifest catalog meta stream
        shell: bash
        run: |
          node <<'NODE'
          const base='https://web-phim-zwsx.onrender.com/hh4k';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){
            const r=await fetch(base+path,{headers:{'user-agent':'HH4K-live-probe/1.2'}});
            const text=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${text.slice(0,300)}`);
            return JSON.parse(text);
          }
          (async()=>{
            let last='';
            for(let i=1;i<=36;i++){
              try{
                const mf=await get('/manifest.json');
                last=`manifest ${mf.version} ${mf.id}`;
                console.log(`TRY ${i}:`,last);
                if(mf.version!=='1.2.0'||mf.id!=='vn.webphim.hh4k.v3'){await sleep(10000);continue;}
                const cat=await get('/catalog/series/hh4k.json');
                console.log('LIVE CATALOG',cat.metas?.length,cat.metas?.slice(0,3).map(x=>x.name));
                if(!cat.metas?.length) throw new Error('live catalog empty');
                const id=encodeURIComponent(cat.metas[0].id);
                const meta=await get('/meta/series/'+id+'.json');
                console.log('LIVE META',meta.meta?.name,'VIDEOS',meta.meta?.videos?.length);
                if(!meta.meta?.videos?.length) throw new Error('live meta has no videos');
                const vid=encodeURIComponent(meta.meta.videos[0].id);
                const streams=await get('/stream/series/'+vid+'.json');
                console.log('LIVE STREAMS',streams.streams?.length,streams.streams?.slice(0,4).map(x=>({title:x.title,url:x.url,externalUrl:x.externalUrl})));
                if(!streams.streams?.length) throw new Error('live streams empty');
                process.exit(0);
              }catch(e){
                last=String(e.message||e); console.log(`TRY ${i} ERROR:`,last);
              }
              await sleep(10000);
            }
            throw new Error('Render did not pass end-to-end check: '+last);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
