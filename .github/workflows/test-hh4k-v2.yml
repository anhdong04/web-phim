name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe correct edge reader URLs
        shell: bash
        run: |
          set +e
          urls=(
            'https://r.jina.ai/https://phimhhtq.com/moi-cap-nhat/'
            'https://r.jina.ai/http://phimhhtq.com/moi-cap-nhat/'
            'https://r.jina.ai/https://www.phimhhtq.com/moi-cap-nhat/'
            'https://r.jina.ai/https://phimhhtq.com/'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L -sS --max-time 40 -D /tmp/h "$u" -o /tmp/b
            head -n 12 /tmp/h
            echo "bytes=$(wc -c </tmp/b)"
            grep -Eio 'Phàm Nhân|Mới Cập Nhật|halim|phimhhtq|Just a moment|security verification' /tmp/b | head -n 20
            head -c 1800 /tmp/b
            echo
          done
