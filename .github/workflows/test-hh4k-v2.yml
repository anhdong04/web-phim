name: Test HH4K v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect hhtq.sh player config
        shell: bash
        run: |
          set -e
          u='https://hhtq.sh/tu-tien/tien-nghich/tap-154.html'
          curl -L -sS --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' "$u" -o /tmp/page
          python3 <<'PY'
          text=open('/tmp/page','r',encoding='utf-8',errors='ignore').read()
          for marker in ['DoPostInfo','player/player.php','halim-player-wrapper','iframe-placeholder','data-type="vip4k','postid','episode','server']:
              print('\n===== MARKER',marker,'=====')
              start=0
              count=0
              while count<6:
                  i=text.find(marker,start)
                  if i<0: break
                  print(text[max(0,i-900):min(len(text),i+1800)])
                  print('\n---')
                  start=i+len(marker); count+=1
          PY
