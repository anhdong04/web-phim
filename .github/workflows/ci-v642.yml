name: Web Phim v6.4.7 HHKungfu Native
on:
  push:
    paths:
      - 'v642_patch.js'
      - 'v645_hhkungfu.js'
      - 'addon_v642.js'
      - 'addon_v641.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/ci-v642.yml'
  workflow_dispatch:

jobs:
  hhkungfu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime dependency
        run: npm install --omit=dev
      - name: Syntax check
        run: node --check v642_patch.js && node --check v645_hhkungfu.js && node --check addon_v642.js && node --check addon_v641.js
      - name: Locate Chromium
        run: |
          which google-chrome || which chromium || true
          google-chrome --version || chromium --version || true
      - name: Native HHKungfu smoke
        env:
          PORT: 7000
          HH3D_PIKPAK_ENABLED: 'false'
          YANHH3D_ENABLED: 'false'
          HHKUNGFU_CHROMIUM_PATH: /usr/bin/google-chrome
          HHKUNGFU_HLS_TIMEOUT_MS: 30000
        run: |
          node addon_v642.js >/tmp/v647.log 2>&1 &
          pid=$!
          ok=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:7000/vn/manifest.json >/tmp/vn.json; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then cat /tmp/v647.log; exit 1; fi
          node <<'NODE'
          const j=require('/tmp/vn.json');
          if (j.version !== '6.4.7') throw new Error('VN manifest version ' + j.version);
          if (!(j.catalogs||[]).some(c=>c.id==='hhkungfu')) throw new Error('HHKungfu catalog missing');
          NODE

          curl --max-time 45 -fsS 'http://127.0.0.1:7000/vn/stream/series/hhu:dau-la-dai-luc-2-tuyet-the-duong-mon:tap-164.json' >/tmp/stream.json
          cat /tmp/stream.json
          node <<'NODE'
          const j=require('/tmp/stream.json');
          if (!(j.streams||[]).length) throw new Error('HHKungfu native streams empty');
          for(const s of j.streams){
            if (!String(s.url||'').includes('helvid.net/api/v1/cdn/stream/')) throw new Error('Not native Helvid HLS: '+JSON.stringify(s));
            if (!String(s.url||'').includes('master.m3u8')) throw new Error('No master.m3u8: '+s.url);
            if (s.externalUrl) throw new Error('externalUrl must not be used');
          }
          console.log('native streams:',j.streams.map(s=>({name:s.name,title:s.title,url:s.url})));
          NODE

          curl -fsS http://127.0.0.1:7000/manifest.json >/tmp/root.json
          curl -fsS http://127.0.0.1:7000/full/manifest.json >/tmp/full.json
          kill -0 $pid
          kill $pid || true
