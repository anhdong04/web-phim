name: Web Phim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
      - name: Startup and admin smoke test
        shell: bash
        run: |
          set -euo pipefail
          env PORT=7799 node addon_v440.js > /tmp/web-phim.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in {1..24}; do
            if curl -fsS http://127.0.0.1:7799/admin/api > /tmp/admin.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 0.25
          done
          cat /tmp/web-phim.log
          test "$ok" -eq 1
          grep -q "v4.4.0 listening" /tmp/web-phim.log
          grep -q '"version":"4.4.0"' /tmp/admin.json
          curl -fsS http://127.0.0.1:7799/admin | grep -q "Web Phim Admin"
