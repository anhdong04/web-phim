name: Web Phim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
      - name: Rendered browser script syntax
        run: |
          node - <<'NODE'
          for (const file of ['./v510_admin_page','./v500_public_page']) {
            const html = require(file)();
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) throw new Error('No inline script found in ' + file);
            for (const script of scripts) new Function(script);
            console.log(file + ': rendered browser JS syntax OK');
          }
          NODE
      - name: v5.4 startup share admin backup restore smoke test
        shell: bash
        run: |
          set -euo pipefail
          env PORT=7799 ADMIN_TOKEN=test-admin PUBLIC_SIGNUP=true node addon_v540.js > /tmp/web-phim.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7799/api/share/settings > /tmp/settings.json 2>/dev/null; then ok=1; break; fi
            sleep 0.25
          done
          cat /tmp/web-phim.log
          test "$ok" -eq 1
          grep -q "v5.4.0 listening" /tmp/web-phim.log
          curl -fsS http://127.0.0.1:7799/admin > /tmp/admin.html
          grep -q "Backup / Restore" /tmp/admin.html
          curl -fsS -H 'x-admin-token: test-admin' http://127.0.0.1:7799/admin/api > /tmp/admin.json
          grep -q '"authorized":true' /tmp/admin.json
          grep -q '"version":"5.4.0"' /tmp/admin.json
          curl -fsS -X POST http://127.0.0.1:7799/api/share -H 'content-type: application/json' -d '{"name":"CI Backup Test","config":{"deviceProfile":"1080p-balanced","streamPreset":"balanced"}}' > /tmp/share.json
          id=$(node -e "const d=require('/tmp/share.json');process.stdout.write(d.id)")
          curl -fsS "http://127.0.0.1:7799/u/$id/manifest.json" > /tmp/manifest.json
          grep -q '"version":"5.4.0"' /tmp/manifest.json
          curl -fsS -H 'x-admin-token: test-admin' http://127.0.0.1:7799/admin/backup > /tmp/backup.json
          curl -fsS -X POST http://127.0.0.1:7799/admin/action -H 'content-type: application/json' -H 'x-admin-token: test-admin' -d '{"action":"share-delete","id":"'"$id"'"}' >/tmp/delete.json
          node - <<'NODE'
          const fs=require('fs'); const backup=JSON.parse(fs.readFileSync('/tmp/backup.json','utf8'));
          fs.writeFileSync('/tmp/restore.json',JSON.stringify({mode:'replace',backup}));
          NODE
          curl -fsS -X POST http://127.0.0.1:7799/admin/restore -H 'content-type: application/json' -H 'x-admin-token: test-admin' --data-binary @/tmp/restore.json >/tmp/restore-result.json
          curl -fsS "http://127.0.0.1:7799/u/$id/manifest.json" | grep -q '"version":"5.4.0"'
      - name: Canonical IMDb catalog and meta regression
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mock-fetch.js <<'NODE'
          const realFetch = global.fetch;
          global.fetch = async function(input, init) {
            const url = String(input);
            const json = body => new Response(JSON.stringify(body), { status: 200, headers: { 'content-type': 'application/json' } });
            if (url.includes('/trending/movie/week?')) return json({results:[{id:603,title:'The Matrix',original_title:'The Matrix',overview:'Test',release_date:'1999-03-31',poster_path:null,backdrop_path:null}]});
            if (url.includes('/movie/603/external_ids?')) return json({imdb_id:'tt0133093'});
            if (url.includes('/find/tt0133093?')) return json({movie_results:[{id:603}],tv_results:[]});
            if (url.includes('/movie/603?')) return json({id:603,title:'The Matrix',original_title:'The Matrix',overview:'Test',release_date:'1999-03-31',poster_path:null,backdrop_path:null,genres:[],credits:{cast:[],crew:[]},external_ids:{imdb_id:'tt0133093'},videos:{results:[]},release_dates:{results:[]},images:{logos:[]},production_countries:[],vote_average:8.2});
            if (url.includes('/find/tt0944947?')) return json({movie_results:[],tv_results:[{id:1399}]});
            if (url.includes('/tv/1399/season/1?')) return json({episodes:[{season_number:1,episode_number:1,name:'Winter Is Coming',air_date:'2011-04-17',still_path:null,overview:'Test'}]});
            if (url.includes('/tv/1399?')) return json({id:1399,name:'Game of Thrones',original_name:'Game of Thrones',overview:'Test',first_air_date:'2011-04-17',poster_path:null,backdrop_path:null,genres:[],credits:{cast:[],crew:[]},external_ids:{imdb_id:'tt0944947'},videos:{results:[]},content_ratings:{results:[]},images:{logos:[]},origin_country:['US'],networks:[],seasons:[{season_number:1}],episode_run_time:[60],vote_average:8.4});
            return realFetch(input, init);
          };
          NODE
          env NODE_OPTIONS="--require=/tmp/mock-fetch.js" PORT=7800 TMDB_API_KEY=test ADMIN_TOKEN=test-admin CANONICAL_IMDB_IDS=true node addon_v540.js >/tmp/web-phim-imdb.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:7800/ >/dev/null 2>&1 && break || sleep 0.25; done
          curl -fsS http://127.0.0.1:7800/manifest.json >/tmp/manifest-imdb.json
          curl -fsS http://127.0.0.1:7800/catalog/movie/home-hot.json >/tmp/catalog.json
          curl -fsS http://127.0.0.1:7800/meta/movie/tt0133093.json >/tmp/movie-meta.json
          curl -fsS http://127.0.0.1:7800/meta/series/tt0944947.json >/tmp/series-meta.json
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest-imdb.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const movie=JSON.parse(fs.readFileSync('/tmp/movie-meta.json','utf8')).meta;
          const series=JSON.parse(fs.readFileSync('/tmp/series-meta.json','utf8')).meta;
          const metaResource=manifest.resources.find(x=>x&&x.name==='meta');
          if(!metaResource?.idPrefixes?.includes('tt')) throw new Error('manifest meta tt prefix missing');
          if(catalog.metas?.[0]?.id!=='tt0133093') throw new Error('catalog primary ID is not IMDb');
          if(movie?.id!=='tt0133093' || movie.behaviorHints?.defaultVideoId!=='tt0133093') throw new Error('movie canonical IMDb meta failed');
          if(series?.id!=='tt0944947' || series.videos?.[0]?.id!=='tt0944947:1:1') throw new Error('series canonical IMDb meta failed');
          console.log('Canonical IMDb catalog/meta regression OK');
          NODE
      - name: Inline stream subtitles regression
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mock-inline-fetch.js <<'NODE'
          const realFetch = global.fetch;
          global.fetch = async function(input, init) {
            const url = String(input);
            const json = body => new Response(JSON.stringify(body), { status: 200, headers: { 'content-type': 'application/json' } });
            if (url.includes('api.themoviedb.org/3/find/tt0133093?')) return json({movie_results:[{id:603}],tv_results:[]});
            if (url.includes('api.themoviedb.org/3/movie/603?')) return json({id:603,title:'The Matrix',original_title:'The Matrix',release_date:'1999-03-31'});
            if (url.includes('phimapi.com/imdb/title/tt0133093')) return json({movie:{quality:'1080p',lang:'Vietsub'},episodes:[{server_name:'KK Server',server_data:[{name:'Full',link_m3u8:'https://kk.test/matrix.m3u8'}]}]});
            if (url.includes('comet.test/stream/movie/tt0133093.json')) return json({streams:[{name:'Comet',title:'The Matrix 1999 1080p WEB-DL x265',url:'https://video.test/matrix.mkv',behaviorHints:{filename:'The.Matrix.1999.1080p.WEB-DL.x265.mkv',videoSize:9000000000}}]});
            if (url.includes('subs.test/subtitles/movie/tt0133093.json')) return json({subtitles:[
              {id:'vi1',lang:'vie',url:'https://subs-cdn.test/matrix.vi.srt',releaseName:'The.Matrix.1999.1080p.WEB-DL.x265'},
              {id:'en1',lang:'eng',url:'https://subs-cdn.test/matrix.en.srt',releaseName:'The.Matrix.1999.1080p.WEB-DL.x265'}
            ]});
            return realFetch(input, init);
          };
          NODE
          env NODE_OPTIONS="--require=/tmp/mock-inline-fetch.js" PORT=7801 TMDB_API_KEY=test COMET_MANIFEST_URL=https://comet.test/manifest.json DEFAULT_SUBTITLE_MANIFEST=https://subs.test/manifest.json INLINE_STREAM_SUBTITLES=true INLINE_SUBTITLES_MAX_PER_STREAM=6 node addon_v540.js >/tmp/web-phim-inline.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:7801/ >/dev/null 2>&1 && break || sleep 0.25; done
          curl -fsS http://127.0.0.1:7801/stream/movie/tt0133093.json >/tmp/streams-inline.json
          node - <<'NODE'
          const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/streams-inline.json','utf8'));
          const comet=(data.streams||[]).find(s=>String(s.name||'').includes('Comet'));
          const kk=(data.streams||[]).find(s=>String(s.name||'').includes('KKPhim'));
          if(!comet) throw new Error('Comet stream missing');
          if(!Array.isArray(comet.subtitles) || comet.subtitles.length<2) throw new Error('inline subtitles missing on Comet stream');
          if(!comet.subtitles.some(s=>s.lang==='vie') || !comet.subtitles.some(s=>s.lang==='eng')) throw new Error('VI/EN inline subtitles missing');
          if(kk && Array.isArray(kk.subtitles) && kk.subtitles.length) throw new Error('KKPhim must not receive injected subtitles');
          console.log('Inline stream subtitles regression OK');
          NODE
