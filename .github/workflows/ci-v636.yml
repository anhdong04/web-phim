name: Web Phim v6.3.6 Strict Dailymotion Match
on:
  push:
    paths:
      - 'v636_yanhh3d.js'
      - 'v636_patch.js'
      - 'addon_v636.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/ci-v636.yml'
  workflow_dispatch:
jobs:
  strict-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check v636_yanhh3d.js && node --check v636_patch.js && node --check addon_v636.js
      - name: Matcher regression
        run: |
          node <<'NODE'
          const { strongTitleMatch, normCore } = require('./v636_yanhh3d');
          const good = strongTitleMatch('Trạch Nhật Phi Thăng Tập 3 Vietsub', 'Trạch Nhật Phi Thăng - Tập 3 [Vietsub]');
          const wrong = strongTitleMatch('Trạch Nhật Phi Thăng Tập 3 Vietsub', 'Thái Tử Phi Thăng Chức Ký - Tập 3 [Vietsub]');
          if (!good.ok) throw new Error('correct title rejected: ' + JSON.stringify(good));
          if (wrong.ok) throw new Error('wrong title accepted: ' + JSON.stringify(wrong));
          if (normCore('Trạch Nhật Phi Thăng Tập 3 Vietsub') !== 'trach nhat phi thang') throw new Error('core normalization failed');
          console.log({ good, wrong });
          NODE
      - name: Generated source smoke
        run: timeout 8s node addon_v636.js > /tmp/v636.log 2>&1 & pid=$!; sleep 2; if ! kill -0 $pid 2>/dev/null; then cat /tmp/v636.log; exit 1; fi; kill $pid || true
