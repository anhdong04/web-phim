name: Diagnose Streamfree Internal HLS
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime deps
        run: npm install --omit=dev
      - name: Call Streamfree internal HLS builder
        env:
          HHKUNGFU_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          timeout 120s node --input-type=commonjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36';
          const watch='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function functionEnd(src,name){
            const m=new RegExp('function\\s+'+name.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'\\s*\\([^)]*\\)\\s*\\{').exec(src);
            if(!m) throw new Error('missing '+name);
            const p=src.indexOf('{',m.index); let d=0,q=null,esc=false;
            for(let i=p;i<src.length;i++){
              const c=src[i];
              if(q){if(esc)esc=false;else if(c==='\\\\')esc=true;else if(c===q)q=null;continue}
              if(c==='"'||c==="'"||c==='`'){q=c;continue}
              if(c==='{')d++; else if(c==='}'&&--d===0)return i+1;
            }
            throw new Error('unclosed '+name);
          }
          function patchApp(src){
            const end=functionEnd(src,'_0x40236b');
            const hook=`;globalThis.__sfBuild=_0x40236b;globalThis.__sfDecryptM3u8=async function(content,nonce){const k=new _0x73517d().update(_0x387157(nonce)).hex().split('').reverse().join('');return _0x4a0bea(content,k);};`;
            return src.slice(0,end)+hook+src.slice(end);
          }

          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.HHKUNGFU_CHROMIUM_PATH,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setUserAgent(UA);
            await page.setRequestInterception(true);
            page.on('request',async req=>{
              try{
                const u=req.url();
                if(/streamfree\.vip\/public\/static\/app\.[^/?]+\.js/i.test(u)){
                  const r=await fetch(u,{headers:{'user-agent':UA,'referer':req.headers().referer||'https://streamfree.vip/'}});
                  const src=await r.text();
                  const body=patchApp(src);
                  console.log('PATCHED_APP',u,'bytes',body.length);
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body});
                }
                return req.continue();
              }catch(e){console.error('intercept',e.message);try{await req.continue()}catch{}}
            });
            await page.goto(watch,{waitUntil:'domcontentloaded',timeout:45000});
            let frame=null;
            for(let i=0;i<50;i++){
              frame=page.frames().find(f=>/streamfree\.vip\/embed\//i.test(f.url()));
              if(frame)break;
              await sleep(300);
            }
            if(!frame)throw new Error('Streamfree iframe missing');
            console.log('FRAME',frame.url());
            let ready=false;
            for(let i=0;i<60;i++){
              ready=await frame.evaluate(()=>typeof globalThis.__sfBuild==='function').catch(()=>false);
              if(ready)break;
              await sleep(250);
            }
            if(!ready)throw new Error('__sfBuild hook missing');
            const input=await frame.evaluate(()=>{
              const els=[...document.querySelectorAll('[data-id]')];
              const el=els.find(x=>x.dataset?.nonce)||els[0];
              const meta=document.querySelector('meta[name="bytecode"]');
              return {
                href:location.href,
                origin:location.origin,
                pathId:location.pathname.split('/')[3]||'',
                id:el?.dataset?.id||'',
                uip:el?.dataset?.uip||'',
                nonce:el?.dataset?.nonce||'',
                checksum:el?.dataset?.checksum||'',
                time:Number(el?.dataset?.time||Date.now()),
                bytecode:meta?.getAttribute('content')||'',
                element:el?.outerHTML?.slice(0,1200)||''
              };
            });
            console.log('INPUT',JSON.stringify({...input,bytecode:input.bytecode.slice(0,120)+'...'}));
            if(!input.id||!input.nonce||!input.bytecode)throw new Error('required embed inputs missing');
            const built=await frame.evaluate(async input=>{
              const out=await globalThis.__sfBuild(window,input.id,input.pathId,input.nonce,input.bytecode,input.time,input.uip,input.checksum,null);
              return {url:String(out?.[0]||''),types:(out||[]).map(x=>typeof x)};
            },input);
            console.log('BUILT',JSON.stringify(built));
            if(!/\/hls\/.*\.m3u8/i.test(built.url))throw new Error('HLS builder returned unexpected URL');
            const fetched=await frame.evaluate(async url=>{
              const r=await fetch(url); const text=await r.text();
              return {status:r.status,url:r.url,text:text.slice(0,10000)};
            },built.url);
            console.log('HLS_FETCH',fetched.status,fetched.url,'head',JSON.stringify(fetched.text.slice(0,300)));
            let playlist=fetched.text;
            if(playlist.includes('#ENC-AESGCM')){
              const dec=await frame.evaluate(async ({text,nonce})=>{
                const out=await globalThis.__sfDecryptM3u8(text,nonce);
                return {playlist:typeof out?.[0]==='string'?out[0]:new TextDecoder().decode(out?.[0]||new Uint8Array()),initType:typeof out?.[1]};
              },{text:playlist,nonce:input.nonce});
              playlist=dec.playlist;
              console.log('DECRYPTED',JSON.stringify(playlist.slice(0,500)),'initType',dec.initType);
            }
            if(!playlist.startsWith('#EXTM3U'))throw new Error('decrypted playlist is not HLS');
            console.log('NATIVE_HLS_OK');
            await browser.close();
          })().catch(e=>{console.error('PROBE_FAIL',e);process.exit(1)});
          NODE
