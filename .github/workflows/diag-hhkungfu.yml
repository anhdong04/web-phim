name: Diagnose Streamfree Internal HLS
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime deps
        run: npm install --omit=dev
      - name: Capture HLS with detector-only patch
        env:
          HHKUNGFU_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          timeout 120s node --input-type=commonjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36';
          const watch='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function patchApp(src){
            const anti=/_0xfcc099\s*=\s*new\s+_0x57bd03\s*\(\s*_0x1b1b2c\s*\)/;
            const matched=anti.test(src);
            console.log('ANTI_MATCH',matched);
            if(!matched) return src;
            return src.replace(anti,"_0xfcc099=new Proxy({}, {get:function(t,p){if(p==='co')return async function(){return false};if(p==='al')return function(){};return function(){return false}}})");
          }

          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.HHKUNGFU_CHROMIUM_PATH,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setUserAgent(UA);
            let captured='';
            let hlsResponse=null;
            await page.setRequestInterception(true);
            page.on('request',async req=>{
              try{
                const u=req.url();
                if(/streamfree\.vip\/hls\/.*\.m3u8/i.test(u)){
                  captured=u; console.log('CAPTURED_HLS',u);
                }
                if(/streamfree\.vip\/public\/static\/app\.[^/?]+\.js/i.test(u)){
                  const rr=await fetch(u,{headers:{'user-agent':UA,'referer':req.headers().referer||'https://streamfree.vip/'}});
                  const body=patchApp(await rr.text());
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body});
                }
                return req.continue();
              }catch(e){console.error('INTERCEPT',e.message);try{await req.continue()}catch{}}
            });
            page.on('response',async resp=>{
              const u=resp.url();
              if(/streamfree\.vip\/hls\/.*\.m3u8/i.test(u)){
                try{hlsResponse={status:resp.status(),url:u,text:(await resp.text()).slice(0,16000)}}catch(e){console.log('HLS_RESPONSE_ERR',e.message)}
              }
            });
            await page.goto(watch,{waitUntil:'domcontentloaded',timeout:45000});
            let frame=null;
            for(let i=0;i<100;i++){frame=page.frames().find(f=>/streamfree\.vip\/embed\//i.test(f.url()));if(frame)break;await sleep(200)}
            if(!frame)throw new Error('iframe missing');
            for(let i=0;i<160&&!captured;i++){
              if(i%20===0){
                const state=await frame.evaluate(()=>{const el=document.querySelector('[data-id]');return{state:el?.dataset?.state||'',msg:document.body?.innerText?.slice(0,180)||''}}).catch(()=>({}));
                console.log('STATE',JSON.stringify(state));
              }
              await sleep(250);
            }
            const state=await frame.evaluate(()=>{const el=document.querySelector('[data-id]');return{state:el?.dataset?.state||'',nonce:el?.dataset?.nonce||'',msg:document.body?.innerText?.slice(0,220)||''}}).catch(()=>({}));
            console.log('FINAL_STATE',JSON.stringify(state));
            if(!captured) throw new Error('HLS not captured');
            for(let i=0;i<20&&!hlsResponse;i++) await sleep(250);
            console.log('HLS_RESPONSE',JSON.stringify(hlsResponse && {status:hlsResponse.status,url:hlsResponse.url,head:hlsResponse.text.slice(0,500)}));
            if(!hlsResponse || hlsResponse.status!==200) throw new Error('HLS response missing/bad');
            console.log('DETECTOR_ONLY_HLS_OK');
            await browser.close();
          })().catch(e=>{console.error('PROBE_FAIL',e);process.exit(1)});
          NODE
