name: Diagnose HHKungfu
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Streamfree decoder
        run: |
          python3 <<'PY'
          import re, html, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          EMBED='https://streamfree.vip/embed/v/Dgh6TOLS'
          REF='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html'
          def get(url, referer=REF):
              h={'User-Agent':UA,'Referer':referer,'Accept':'text/html,application/javascript,*/*'}
              r=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(r,timeout=30) as x:
                  return x.read().decode('utf-8','replace')
          page=get(EMBED)
          print('PAGE LEN',len(page))
          print('\nSCRIPTS:')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          print(srcs)
          print('\nBYTECODE CONTEXT:')
          for m in re.finditer(r'bytecode|querySelector|meta\[name=["\']bytecode|atob|TextDecoder|WebAssembly|fetch\(',page,re.I):
              print(page[max(0,m.start()-700):m.start()+1800])
          for src in srcs:
              if src.startswith('//'): src='https:'+src
              elif src.startswith('/'): src='https://streamfree.vip'+src
              elif not src.startswith('http'): src=urllib.parse.urljoin(EMBED,src)
              try:
                  js=get(src,EMBED)
                  print('\n=== JS',src,'LEN',len(js),'===')
                  hits=[]
                  for term in ['bytecode','atob','TextDecoder','WebAssembly','m3u8','mp4','source','playlist','fetch(']:
                      if term.lower() in js.lower(): hits.append(term)
                  print('HITS',hits)
                  for term in hits:
                      pos=js.lower().find(term.lower())
                      print('CTX',term,js[max(0,pos-1200):pos+3000])
              except Exception as e:
                  print('JS ERR',src,e)
          PY
