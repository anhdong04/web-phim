name: Diagnose HHKungfu
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Locate browser
        run: |
          which google-chrome || which chromium || which chromium-browser || true
          google-chrome --version || chromium --version || true
      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core@24
      - name: Dump console payloads and media
        run: |
          node --input-type=commonjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          const safe=v=>{try{return JSON.stringify(v)}catch{return String(v)}};
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36');
            const urls=[];
            const inspectText=s=>{const m=String(s||'').match(/https?:\/\/[^\s"'<>]+/g)||[]; for(const u of m){if(/m3u8|mp4|stream|cdn|playlist|manifest/i.test(u)){console.log('FOUNDURL',u);urls.push(u)}}};
            page.on('request',r=>{const u=r.url(); if(/m3u8|mp4|playlist|manifest|\.ts(?:\?|$)|\.m4s(?:\?|$)/i.test(u)){console.log('MEDIAREQ',u);urls.push(u)}});
            page.on('response',r=>{const ct=r.headers()['content-type']||''; if(/mpegurl|video\//i.test(ct)){console.log('MEDIARES',r.status(),ct,r.url());urls.push(r.url())}});
            let consoleCount=0;
            page.on('console',async msg=>{
              if(consoleCount++>80) return;
              const vals=[];
              for(const a of msg.args()){
                try{vals.push(await a.jsonValue())}catch{vals.push(a.toString())}
              }
              const line='CP '+msg.type()+' '+safe(vals);
              console.log(line.slice(0,20000)); inspectText(line);
            });
            const watch='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html';
            await page.goto(watch,{waitUntil:'domcontentloaded',timeout:45000});
            let sf=null; for(let i=0;i<30;i++){sf=page.frames().find(f=>/streamfree\.vip\/embed\//i.test(f.url())); if(sf)break; await new Promise(r=>setTimeout(r,500))}
            if(!sf) throw new Error('no streamfree iframe');
            console.log('SF',sf.url());
            await new Promise(r=>setTimeout(r,9000));
            const dump=await sf.evaluate(()=>{
              const grab=(v,d=0)=>{if(d>2||v==null)return v; if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return v; if(Array.isArray(v))return v.slice(0,30).map(x=>grab(x,d+1)); if(typeof v==='object'){const o={}; for(const k of Object.keys(v).slice(0,80)){try{o[k]=grab(v[k],d+1)}catch{}} return o} return String(v)};
              const out={};
              out.body=document.body.innerText.slice(0,3000);
              out.scripts=[...document.scripts].map(s=>s.src||s.textContent.slice(0,500));
              out.keys=Object.keys(window).filter(k=>/data|source|stream|media|play|config|file|url|byte/i.test(k));
              for(const k of out.keys.slice(0,80)){try{out['g:'+k]=grab(window[k])}catch{}}
              if(typeof jwplayer==='function'){try{const p=jwplayer();out.jw=grab(p);out.playlist=p.getPlaylist?.();out.item=p.getPlaylistItem?.();out.config=p.getConfig?.()}catch(e){out.jwe=String(e)}}
              return out;
            });
            const ds=safe(dump); console.log('DUMP',ds.slice(0,50000)); inspectText(ds);
            console.log('URLS',[...new Set(urls)]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
