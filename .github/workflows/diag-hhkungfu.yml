name: Diagnose Streamfree Internal HLS
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime deps
        run: npm install --omit=dev
      - name: Capture Streamfree natural HLS build
        env:
          HHKUNGFU_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          timeout 120s node --input-type=commonjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36';
          const watch='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function functionRange(src,name){
            const m=new RegExp('function\\s+'+name.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'\\s*\\([^)]*\\)\\s*\\{').exec(src);
            if(!m) throw new Error('missing '+name);
            const p=src.indexOf('{',m.index); let d=0,q=null,esc=false;
            for(let i=p;i<src.length;i++){
              const c=src[i];
              if(q){if(esc)esc=false;else if(c==='\\\\')esc=true;else if(c===q)q=null;continue}
              if(c==='"'||c==="'"||c==='`'){q=c;continue}
              if(c==='{')d++; else if(c==='}'&&--d===0)return {start:m.index,end:i+1};
            }
            throw new Error('unclosed '+name);
          }
          function patchApp(src){
            const r=functionRange(src,'_0x40236b');
            const f=src.slice(r.start,r.end);
            const ri=f.indexOf('return '), semi=f.lastIndexOf(';');
            if(ri<0||semi<ri)throw new Error('builder return not found');
            const expr=f.slice(ri+7,semi);
            const replacement=`globalThis.__sfNaturalArgs=Array.from(arguments).slice(1);var __sfR=${expr};globalThis.__sfNaturalPromise=Promise.resolve(__sfR).then(function(v){globalThis.__sfNaturalResult=v;return v;},function(e){globalThis.__sfNaturalError=String(e&&e.stack||e);throw e;});return __sfR;`;
            const nf=f.slice(0,ri)+replacement+f.slice(semi+1);
            const hook=`;globalThis.__sfBuild=_0x40236b;globalThis.__sfDecryptM3u8=async function(content,nonce){const k=new _0x73517d().update(_0x387157(nonce)).hex().split('').reverse().join('');return _0x4a0bea(content,k);};`;
            return src.slice(0,r.start)+nf+hook+src.slice(r.end);
          }

          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.HHKUNGFU_CHROMIUM_PATH,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setUserAgent(UA);
            let captured='';
            await page.setRequestInterception(true);
            page.on('request',async req=>{
              try{
                const u=req.url();
                if(/streamfree\.vip\/hls\/.*\.m3u8/i.test(u)){
                  captured=u; console.log('CAPTURED_HLS',u);
                }
                if(/streamfree\.vip\/public\/static\/app\.[^/?]+\.js/i.test(u)){
                  const rr=await fetch(u,{headers:{'user-agent':UA,'referer':req.headers().referer||'https://streamfree.vip/'}});
                  const src=await rr.text(); const body=patchApp(src);
                  console.log('PATCHED_APP',u,'bytes',body.length);
                  return req.respond({status:200,contentType:'application/javascript; charset=utf-8',body});
                }
                return req.continue();
              }catch(e){console.error('intercept',e.message);try{await req.continue()}catch{}}
            });
            await page.goto(watch,{waitUntil:'domcontentloaded',timeout:45000});
            let frame=null;
            for(let i=0;i<60;i++){frame=page.frames().find(f=>/streamfree\.vip\/embed\//i.test(f.url()));if(frame)break;await sleep(250)}
            if(!frame)throw new Error('Streamfree iframe missing');
            console.log('FRAME',frame.url());
            for(let i=0;i<80&&!captured;i++){
              const state=await frame.evaluate(()=>({
                ready:typeof globalThis.__sfBuild==='function',
                natural:globalThis.__sfNaturalResult?String(globalThis.__sfNaturalResult?.[0]||''):'',
                err:globalThis.__sfNaturalError||'',
                body:document.body?.innerText?.slice(0,140)||''
              })).catch(()=>({}));
              if(state.natural){captured=state.natural;console.log('NATURAL_HLS',captured);break}
              if(state.err)console.log('NATURAL_ERR',state.err.slice(0,600));
              await sleep(250);
            }
            const input=await frame.evaluate(()=>{
              const el=[...document.querySelectorAll('[data-id]')].find(x=>x.dataset?.nonce)||document.querySelector('[data-id]');
              return {nonce:el?.dataset?.nonce||'',state:el?.dataset?.state||'',message:document.body?.innerText?.slice(0,240)||''};
            });
            console.log('FRAME_STATE',JSON.stringify(input));
            if(!/\/hls\/.*\.m3u8/i.test(captured))throw new Error('natural HLS URL not captured');
            const fetched=await frame.evaluate(async url=>{const r=await fetch(url);return {status:r.status,url:r.url,text:(await r.text()).slice(0,12000)}},captured);
            console.log('HLS_FETCH',fetched.status,fetched.url,'head',JSON.stringify(fetched.text.slice(0,320)));
            let playlist=fetched.text;
            if(playlist.includes('#ENC-AESGCM')){
              const dec=await frame.evaluate(async ({text,nonce})=>{
                const out=await globalThis.__sfDecryptM3u8(text,nonce);
                const p=out?.[0];
                return typeof p==='string'?p:new TextDecoder().decode(p||new Uint8Array());
              },{text:playlist,nonce:input.nonce});
              playlist=dec;
              console.log('DECRYPTED_HEAD',JSON.stringify(playlist.slice(0,800)));
            }
            if(!playlist.startsWith('#EXTM3U'))throw new Error('playlist is not HLS');
            console.log('NATIVE_HLS_OK');
            await browser.close();
          })().catch(e=>{console.error('PROBE_FAIL',e);process.exit(1)});
          NODE
