name: Diagnose Streamfree Detector Flow
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and decode Streamfree call sites
        run: |
          python3 <<'PY'
          import urllib.request
          req=urllib.request.Request('https://streamfree.vip/public/static/app.bb288bfe.js',headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://streamfree.vip/embed/v/Dgh6TOLS'
          })
          open('/tmp/app.js','wb').write(urllib.request.urlopen(req,timeout=30).read())
          PY
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('/tmp/app.js','utf8');
          function balancedFunction(text,name){
            const m=new RegExp('function\\s+'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*\\([^)]*\\)\\s*\\{').exec(text);if(!m)return '';
            const p=text.indexOf('{',m.index);let d=0,q=null,e=false;
            for(let i=p;i<text.length;i++){const c=text[i];if(q){if(e)e=false;else if(c==='\\\\')e=true;else if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return text.slice(m.index,i+1)}return '';
          }
          function fn0(name){const f=balancedFunction(src,name);if(!f)throw Error('missing '+name);return{text:f,end:src.indexOf(f)+f.length}}
          const f24=fn0('a0_0x24a9'),f34=fn0('a0_0x34f2');const be=src.indexOf(',!(function',f34.end);if(be<0)throw Error('bootstrap marker');
          const ctx={decodeURIComponent,parseInt,console};vm.createContext(ctx);vm.runInContext(f24.text+'\n'+f34.text+'\n'+src.slice(f34.end,be)+')',ctx,{timeout:10000});
          const dec=ctx.a0_0x24a9,aliases=new Set(['a0_0x24a9']);for(const m of src.matchAll(/\b(_0x[0-9a-f]+)\s*=\s*a0_0x24a9\b/gi))aliases.add(m[1]);
          let out=src;for(const alias of aliases){const esc=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('\\b'+esc+'\\(\\s*(0x[0-9a-fA-F]+|\\d+)\\s*,\\s*([\\\'\"])(.*?)\\2\\s*\\)','g');out=out.replace(re,(all,n,q,k)=>{try{return JSON.stringify(dec(Number(n),k))}catch{return all}})}
          const clean=s=>String(s).replace(/\\\//g,'/').replace(/\s+/g,' ').trim();
          function allContexts(term,r=1600,max=12){const low=out.toLowerCase(),needle=term.toLowerCase();let p=0,n=0;console.log('\n===== '+term+' =====');while(n<max&&(p=low.indexOf(needle,p))>=0){console.log('['+(++n)+'] '+clean(out.slice(Math.max(0,p-r),Math.min(out.length,p+needle.length+r))));p+=needle.length}if(!n)console.log('(none)')}
          for(const t of ['_0xfcc099','._co','["co"]','._al','["al"]','_0x40236b(','(-3)','công cụ nhà phát triển','devtools']) allContexts(t,1800,16);
          console.log('\n===== DETECTOR CLASS =====');
          for(const name of ['_0x57bd03','_0x1b1b2c']){const f=balancedFunction(out,name);if(f)console.log(name+'\n'+clean(f));else allContexts(name,2500,5)}
          NODE
