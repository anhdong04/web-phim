name: Diagnose Streamfree Deobfuscation
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract HLS builder functions
        run: |
          python3 <<'PY'
          import urllib.request
          req=urllib.request.Request('https://streamfree.vip/public/static/app.bb288bfe.js',headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://streamfree.vip/embed/v/Dgh6TOLS'
          })
          open('/tmp/app.js','wb').write(urllib.request.urlopen(req,timeout=30).read())
          PY
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('/tmp/app.js','utf8');
          function balancedFunction(text,name){
            const m=new RegExp('function\\s+'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*\\([^)]*\\)\\s*\\{').exec(text);
            if(!m)return '';
            const p=text.indexOf('{',m.index);let d=0,q=null,e=false;
            for(let i=p;i<text.length;i++){const c=text[i];if(q){if(e)e=false;else if(c==='\\\\')e=true;else if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return text.slice(m.index,i+1)}
            return '';
          }
          function fn0(name){
            const f=balancedFunction(src,name); if(!f)throw Error('missing '+name);
            return {text:f,end:src.indexOf(f)+f.length};
          }
          const f24=fn0('a0_0x24a9'), f34=fn0('a0_0x34f2');
          const bootEnd=src.indexOf(',!(function',f34.end); if(bootEnd<0)throw Error('bootstrap marker missing');
          const bootstrap=src.slice(f34.end,bootEnd)+')';
          const ctx={decodeURIComponent,parseInt,console};vm.createContext(ctx);
          vm.runInContext(f24.text+'\n'+f34.text+'\n'+bootstrap,ctx,{timeout:10000});
          const dec=ctx.a0_0x24a9;
          const aliases=new Set(['a0_0x24a9']);
          for(const m of src.matchAll(/\b(_0x[0-9a-f]+)\s*=\s*a0_0x24a9\b/gi))aliases.add(m[1]);
          let out=src;
          for(const alias of aliases){
            const esc=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
            const re=new RegExp('\\b'+esc+'\\(\\s*(0x[0-9a-fA-F]+|\\d+)\\s*,\\s*([\\\'\"])(.*?)\\2\\s*\\)','g');
            out=out.replace(re,(all,n,q,key)=>{try{return JSON.stringify(dec(Number(n),key))}catch{return all}});
          }
          const clean=s=>String(s).replace(/\\\//g,'/');
          const targets=['_0x40236b','_0x528a1c','_0x420231','_0x1759bc','_0x34e5b5','_0xd7f14','_0x4a0bea','_0x25d710','_0x530368','_0x73517d','_0x387157','_0x733455','_0x29df87','_0x8d0a9c','_0x28368c'];
          for(const name of targets){
            console.log('\n===== '+name+' =====');
            const f=balancedFunction(out,name);
            if(f){console.log(clean(f));continue}
            let p=out.indexOf(name+'='); if(p<0)p=out.indexOf(name+' ='); if(p<0)p=out.indexOf(name);
            if(p<0){console.log('(missing)');continue}
            console.log(clean(out.slice(Math.max(0,p-1800),Math.min(out.length,p+6500))));
          }
          const needle='new URL("/hls/"';
          const p=out.indexOf(needle);
          console.log('\n===== HLS BUILD WIDE CONTEXT =====');
          console.log(p<0?'(missing)':clean(out.slice(Math.max(0,p-9000),Math.min(out.length,p+9000))));
          NODE
