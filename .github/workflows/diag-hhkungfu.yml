name: Diagnose HHKungfu Native Resolver
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
      - 'v645_hhkungfu.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime dependency
        run: npm install --omit=dev
      - name: Locate Chrome
        run: |
          which google-chrome
          google-chrome --version
      - name: Resolve one HHKungfu HLS
        env:
          HHKUNGFU_CHROMIUM_PATH: /usr/bin/google-chrome
          HHKUNGFU_HLS_TIMEOUT_MS: 30000
        run: |
          timeout 40s node --input-type=commonjs <<'NODE'
          const h=require('./v645_hhkungfu');
          (async()=>{
            const u=await h.resolveHls(
              'https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html',
              'diag-tap164-sv1'
            );
            console.log('RESOLVED',u);
            if(!/https:\/\/[^/]*helvid\.net\/api\/v1\/cdn\/stream\/.+\/master\.m3u8/i.test(u)) throw new Error('Unexpected HLS '+u);
            process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
