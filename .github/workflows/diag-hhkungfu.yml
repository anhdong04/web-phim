name: Diagnose Streamfree Deobfuscation
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Streamfree app source
        run: |
          python3 <<'PY'
          import urllib.request
          url='https://streamfree.vip/public/static/app.bb288bfe.js'
          req=urllib.request.Request(url,headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://streamfree.vip/embed/v/Dgh6TOLS'
          })
          raw=urllib.request.urlopen(req,timeout=30).read()
          open('/tmp/app.js','wb').write(raw)
          print('downloaded',len(raw))
          PY
      - name: Decode literal string calls
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const src=fs.readFileSync('/tmp/app.js','utf8');
          function functionSource(name){
            const re=new RegExp('function\\s+'+name+'\\s*\\([^)]*\\)\\s*\\{');
            const m=re.exec(src); if(!m) throw new Error('missing '+name);
            let i=m.index, p=src.indexOf('{',m.index), depth=0, q=null, esc=false, tpl=false;
            for(let j=p;j<src.length;j++){
              const c=src[j];
              if(q){ if(esc){esc=false;continue} if(c==='\\\\'){esc=true;continue} if(c===q){q=null} continue; }
              if(c==='"'||c==="'"){q=c;continue}
              if(c==='{') depth++; else if(c==='}'){depth--; if(depth===0) return src.slice(i,j+1)}
            }
            throw new Error('unclosed '+name);
          }
          const f1=functionSource('a0_0x34f2');
          const f2=functionSource('a0_0x24a9');
          const ctx={decodeURIComponent, console}; vm.createContext(ctx); vm.runInContext(f1+'\n'+f2,ctx);
          const dec=ctx.a0_0x24a9;
          let count=0,fail=0;
          const out=src.replace(/a0_0x24a9\(\s*(0x[0-9a-fA-F]+|\d+)\s*,\s*(['"])(.*?)\2\s*\)/g,(all,n,q,key)=>{
            try{const v=dec(Number(n),key); count++; return JSON.stringify(v)}catch(e){fail++;return all}
          });
          fs.writeFileSync('/tmp/app.deob.js',out);
          console.log('decoded',count,'failed',fail,'len',out.length);
          const terms=['devtools','developer','console','jwplayer','bytecode','helvid','m3u8','master.m3u8','fetch','playlist','source','file','error','webdriver','debugger','visibility','performance','setinterval','settimeout'];
          for(const term of terms){
            console.log('\n===== '+term+' =====');
            const low=out.toLowerCase(); let pos=0,hits=0;
            while(hits<12 && (pos=low.indexOf(term.toLowerCase(),pos))>=0){
              console.log(out.slice(Math.max(0,pos-1800),Math.min(out.length,pos+3500))+'\n---'); pos+=term.length;hits++;
            }
            console.log('hits shown',hits);
          }
          NODE
