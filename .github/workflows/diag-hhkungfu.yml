name: Diagnose HHKungfu
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Locate browser
        run: |
          which google-chrome || which chromium || which chromium-browser || true
          google-chrome --version || chromium --version || true
      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core@24
      - name: Inspect JWPlayer and capture media
        run: |
          node --input-type=commonjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error('No chromium executable');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required','--disable-features=SafeBrowsingEnhancedProtection']});
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36');
            const seen=[];
            const interesting=(u)=>/m3u8|\.mp4(?:\?|$)|playlist|manifest|\.ts(?:\?|$)|\.m4s(?:\?|$)|\.key(?:\?|$)|streamfree|cdn/i.test(u);
            page.on('request',req=>{ const u=req.url(); if(interesting(u)){ console.log('REQ',req.resourceType(),u,'REF',req.headers().referer||''); seen.push(u); } });
            page.on('response',res=>{ const u=res.url(); const ct=(res.headers()['content-type']||''); if(interesting(u)||/mpegurl|video\//i.test(ct)){ console.log('RES',res.status(),ct,u); seen.push(u); } });
            page.on('console',msg=>console.log('CONSOLE',msg.type(),msg.text()));
            const watch='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html';
            console.log('GOTO',watch);
            await page.goto(watch,{waitUntil:'domcontentloaded',timeout:45000});
            let sf=null;
            for(let i=0;i<30;i++){
              sf=page.frames().find(f=>/streamfree\.vip\/embed\//i.test(f.url()));
              if(sf) break;
              await new Promise(r=>setTimeout(r,500));
            }
            if(!sf) throw new Error('Streamfree iframe not found');
            console.log('STREAMFREE FRAME',sf.url());
            await new Promise(r=>setTimeout(r,3000));
            const state=await sf.evaluate(()=>{
              const result={};
              result.hasJW=typeof window.jwplayer==='function';
              result.video=[...document.querySelectorAll('video')].map(v=>({src:v.src,currentSrc:v.currentSrc,readyState:v.readyState,networkState:v.networkState}));
              if(result.hasJW){
                try{const p=window.jwplayer(); result.state=p.getState?.(); result.playlist=p.getPlaylist?.(); result.item=p.getPlaylistItem?.(); result.config=p.getConfig?.(); result.error=p.getError?.();}catch(e){result.jwError=String(e)}
              }
              result.metaBytecode=document.querySelector('meta[name="bytecode"]')?.content?.slice(0,80)||'';
              result.globalKeys=Object.keys(window).filter(k=>/play|media|source|stream|byte|config/i.test(k)).slice(0,100);
              return result;
            });
            console.log('JW STATE',JSON.stringify(state,null,2));
            const playResult=await sf.evaluate(()=>{
              try{const p=window.jwplayer(); p.setMute?.(true); const r=p.play?.(true); return {ok:true,ret:String(r),state:p.getState?.()};}
              catch(e){return {ok:false,error:String(e)}}
            });
            console.log('PLAY RESULT',playResult);
            await new Promise(r=>setTimeout(r,12000));
            const after=await sf.evaluate(()=>{
              const p=typeof window.jwplayer==='function'?window.jwplayer():null;
              return {
                state:p?.getState?.(),
                item:p?.getPlaylistItem?.(),
                playlist:p?.getPlaylist?.(),
                error:p?.getError?.(),
                video:[...document.querySelectorAll('video')].map(v=>({src:v.src,currentSrc:v.currentSrc,readyState:v.readyState,networkState:v.networkState}))
              };
            });
            console.log('AFTER',JSON.stringify(after,null,2));
            console.log('SEEN UNIQUE',[...new Set(seen)]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
