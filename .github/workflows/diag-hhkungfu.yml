name: Diagnose Streamfree Token Cipher
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decode token cipher functions
        run: |
          python3 <<'PY'
          import urllib.request
          req=urllib.request.Request('https://streamfree.vip/public/static/app.bb288bfe.js',headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://streamfree.vip/embed/v/Dgh6TOLS'
          })
          open('/tmp/app.js','wb').write(urllib.request.urlopen(req,timeout=30).read())
          PY
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'),vm=require('vm');const src=fs.readFileSync('/tmp/app.js','utf8');
          function bf(text,name){const m=new RegExp('function\\s+'+name.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'\\s*\\([^)]*\\)\\s*\\{').exec(text);if(!m)return'';const p=text.indexOf('{',m.index);let d=0,q=null,e=false;for(let i=p;i<text.length;i++){const c=text[i];if(q){if(e)e=false;else if(c==='\\\\')e=true;else if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return text.slice(m.index,i+1)}return''}
          const f24=bf(src,'a0_0x24a9'),f34=bf(src,'a0_0x34f2'),e34=src.indexOf(f34)+f34.length,be=src.indexOf(',!(function',e34);const ctx={decodeURIComponent,parseInt,console};vm.createContext(ctx);vm.runInContext(f24+'\n'+f34+'\n'+src.slice(e34,be)+')',ctx,{timeout:10000});
          const dec=ctx.a0_0x24a9,aliases=new Set(['a0_0x24a9']);for(const m of src.matchAll(/\b(_0x[0-9a-f]+)\s*=\s*a0_0x24a9\b/gi))aliases.add(m[1]);let out=src;for(const a of aliases){const x=a.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&');out=out.replace(new RegExp('\\b'+x+'\\(\\s*(0x[0-9a-fA-F]+|\\d+)\\s*,\\s*([\\\'\"])(.*?)\\2\\s*\\)','g'),(z,n,q,k)=>{try{return JSON.stringify(dec(Number(n),k))}catch{return z}})}
          const clean=s=>String(s).replace(/\\\//g,'/').replace(/\s+/g,' ').trim();
          const names=['_0x49426d','_0x345a15','_0x526de5','_0x10430b','_0xcc5ccf','_0x5bcb33','_0x387157','_0x34e5b5','_0x5a8cb2','_0x8d0a9c'];
          function contexts(term,r=7000,max=2){let p=0,n=0;console.log('\n===CTX '+term+'===');while(n<max&&(p=out.indexOf(term,p))>=0){console.log(clean(out.slice(Math.max(0,p-r),Math.min(out.length,p+r))));p+=term.length;n++}if(!n)console.log('(none)')}
          for(const name of names){console.log('\n===FUNC '+name+'===');const f=bf(out,name);if(f)console.log(clean(f));else contexts(name)}
          NODE
