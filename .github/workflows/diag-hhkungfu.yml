name: Diagnose HHKungfu
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Locate browser
        run: |
          which google-chrome || which chromium || which chromium-browser || true
          google-chrome --version || chromium --version || true
      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core@24
      - name: Capture media from HHKungfu
        run: |
          node --input-type=commonjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error('No chromium executable');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required','--disable-features=SafeBrowsingEnhancedProtection']});
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36');
            const seen=[];
            const interesting=(u)=>/m3u8|\.mp4(?:\?|$)|playlist|manifest|\.ts(?:\?|$)|\.m4s(?:\?|$)|\.key(?:\?|$)|streamfree/i.test(u);
            page.on('request',req=>{ const u=req.url(); if(interesting(u)){ console.log('REQ',req.resourceType(),u,'REF',req.headers().referer||''); seen.push(u); } });
            page.on('response',res=>{ const u=res.url(); const ct=(res.headers()['content-type']||''); if(interesting(u)||/mpegurl|video\//i.test(ct)){ console.log('RES',res.status(),ct,u); seen.push(u); } });
            page.on('console',msg=>console.log('CONSOLE',msg.type(),msg.text()));
            page.on('framenavigated',f=>{ if(/streamfree|hhkungfu/i.test(f.url())) console.log('FRAME',f.url()); });
            const url='https://hhkungfu.ee/watch-dau-la-dai-luc-2-tuyet-the-duong-mon/tap-164-sv1.html';
            console.log('GOTO',url);
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            console.log('PAGE STATUS',resp?.status());
            await new Promise(r=>setTimeout(r,8000));
            const buttons=await page.$$('button, .jw-icon-display, .vjs-big-play-button, [aria-label*=Play], [title*=Play]');
            console.log('PLAY CANDIDATES',buttons.length);
            for(const b of buttons.slice(0,4)){ try{await b.click(); await new Promise(r=>setTimeout(r,2000));}catch{} }
            await new Promise(r=>setTimeout(r,8000));
            console.log('FRAMES',page.frames().map(f=>f.url()));
            for(const f of page.frames()){
              try{
                const vids=await f.evaluate(()=>[...document.querySelectorAll('video')].map(v=>({src:v.src,currentSrc:v.currentSrc,readyState:v.readyState,networkState:v.networkState})));
                if(vids.length) console.log('VIDEOS',f.url(),vids);
              }catch{}
            }
            console.log('SEEN UNIQUE',[...new Set(seen)]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
