name: Diagnose Streamfree Deobfuscation
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compact Streamfree runtime analysis
        run: |
          python3 <<'PY'
          import urllib.request
          url='https://streamfree.vip/public/static/app.bb288bfe.js'
          req=urllib.request.Request(url,headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://streamfree.vip/embed/v/Dgh6TOLS'
          })
          raw=urllib.request.urlopen(req,timeout=30).read()
          open('/tmp/app.js','wb').write(raw)
          print('downloaded',len(raw))
          PY
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const src=fs.readFileSync('/tmp/app.js','utf8');
          function functionSource(name){
            const re=new RegExp('function\\s+'+name+'\\s*\\([^)]*\\)\\s*\\{');
            const m=re.exec(src); if(!m) throw new Error('missing '+name);
            const p=src.indexOf('{',m.index); let depth=0,q=null,esc=false;
            for(let j=p;j<src.length;j++){
              const c=src[j];
              if(q){if(esc){esc=false;continue} if(c==='\\\\'){esc=true;continue} if(c===q)q=null; continue}
              if(c==='"'||c==="'"){q=c;continue}
              if(c==='{')depth++; else if(c==='}'&&--depth===0)return src.slice(m.index,j+1);
            }
            throw new Error('unclosed '+name);
          }
          const ctx={decodeURIComponent,console}; vm.createContext(ctx);
          vm.runInContext(functionSource('a0_0x34f2')+'\n'+functionSource('a0_0x24a9'),ctx);
          let decoded=0, failed=0;
          const out=src.replace(/a0_0x24a9\(\s*(0x[0-9a-fA-F]+|\d+)\s*,\s*(['"])(.*?)\2\s*\)/g,(all,n,q,key)=>{
            try{decoded++;return JSON.stringify(ctx.a0_0x24a9(Number(n),key))}catch{failed++;return all}
          });
          fs.writeFileSync('/tmp/app.deob.js',out);
          console.log('decoded='+decoded+' failed='+failed+' len='+out.length);

          function clean(s){return String(s).replace(/\\\//g,'/').replace(/\\n/g,' ').replace(/\s+/g,' ').trim()}
          function contexts(term,limit=4,radius=420){
            const low=out.toLowerCase(), needle=term.toLowerCase(); let pos=0,n=0;
            console.log('\n## '+term);
            while(n<limit && (pos=low.indexOf(needle,pos))>=0){
              console.log('['+(n+1)+'] '+clean(out.slice(Math.max(0,pos-radius),Math.min(out.length,pos+needle.length+radius))));
              pos+=needle.length;n++;
            }
            if(!n) console.log('(none)');
          }

          // Only print strings which are likely to reveal the media/API flow.
          const literalRe=/(?:"((?:\\.|[^"\\])*)"|'((?:\\.|[^'\\])*)')/g;
          const interesting=[]; let m;
          while((m=literalRe.exec(out))){
            let s=clean(m[1]??m[2]??'');
            if(s.length>240) continue;
            if(/helvid|m3u8|\/api\/|cdn|stream|token|auth|bytecode|jwplayer|playlist|source|embed|player/i.test(s)) interesting.push(s);
          }
          console.log('\n## UNIQUE INTERESTING STRINGS');
          for(const s of [...new Set(interesting)].slice(0,120)) console.log(s);

          for(const t of ['helvid','master.m3u8','m3u8','/api/','fetch(','XMLHttpRequest','jwplayer','bytecode','token','authorization','cdn/stream']) contexts(t,4,420);

          // Show compact call sites which are most likely to assemble network requests.
          console.log('\n## NETWORK-LIKE CALL SITES');
          const callRe=/(fetch\s*\(|axios\.(?:get|post)\s*\(|\.open\s*\(\s*["'](?:GET|POST)["'])/gi;
          let c,count=0;
          while(count<16 && (c=callRe.exec(out))){
            console.log('['+(++count)+'] '+clean(out.slice(Math.max(0,c.index-300),Math.min(out.length,c.index+800))));
          }
          NODE
