name: Diagnose Streamfree Deobfuscation
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and decode Streamfree app
        run: |
          python3 <<'PY'
          import urllib.request
          url='https://streamfree.vip/public/static/app.bb288bfe.js'
          req=urllib.request.Request(url,headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://streamfree.vip/embed/v/Dgh6TOLS'
          })
          raw=urllib.request.urlopen(req,timeout=30).read()
          open('/tmp/app.js','wb').write(raw)
          print('downloaded',len(raw))
          PY
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const src=fs.readFileSync('/tmp/app.js','utf8');
          function functionSource(name){
            const re=new RegExp('function\\s+'+name+'\\s*\\([^)]*\\)\\s*\\{');
            const m=re.exec(src); if(!m) throw new Error('missing '+name);
            const p=src.indexOf('{',m.index); let depth=0,q=null,esc=false;
            for(let j=p;j<src.length;j++){
              const c=src[j];
              if(q){if(esc){esc=false;continue} if(c==='\\\\'){esc=true;continue} if(c===q)q=null; continue}
              if(c==='"'||c==="'"){q=c;continue}
              if(c==='{')depth++; else if(c==='}'&&--depth===0)return src.slice(m.index,j+1);
            }
            throw new Error('unclosed '+name);
          }
          const ctx={decodeURIComponent,console}; vm.createContext(ctx);
          vm.runInContext(functionSource('a0_0x34f2')+'\n'+functionSource('a0_0x24a9'),ctx);
          let decoded=0;
          const out=src.replace(/a0_0x24a9\(\s*(0x[0-9a-fA-F]+|\d+)\s*,\s*(['"])(.*?)\2\s*\)/g,(all,n,q,key)=>{
            try{decoded++;return JSON.stringify(ctx.a0_0x24a9(Number(n),key))}catch{return all}
          });
          fs.writeFileSync('/tmp/app.deob.js',out);
          console.log('decoded',decoded,'len',out.length);

          const urls=[...new Set((out.match(/https?:\\?\/\\?\/[A-Za-z0-9._~:/?#@!$&'()*+,;=%\\-]+/g)||[]).map(x=>x.replace(/\\\//g,'/')))];
          console.log('\n===== URLS =====');
          for(const u of urls.filter(u=>/helvid|stream|api|cdn|player|embed|jw/i.test(u)).slice(0,100)) console.log(u);

          const terms=['helvid.net','cdn/stream','master.m3u8','m3u8','/api/v1/','jwplayer','setup(','sources','playlist','fetch(','authorization','token','signature','cookie'];
          const low=out.toLowerCase();
          for(const term of terms){
            console.log('\n===== '+term+' =====');
            let pos=0,hits=0;
            while(hits<8 && (pos=low.indexOf(term.toLowerCase(),pos))>=0){
              const a=Math.max(0,pos-700), b=Math.min(out.length,pos+1400);
              console.log(out.slice(a,b).replace(/\s+/g,' ')+'\n---');
              pos+=term.length; hits++;
            }
            console.log('hits',hits);
          }
          NODE
