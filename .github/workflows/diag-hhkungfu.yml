name: Diagnose HHKungfu
on:
  push:
    paths:
      - '.github/workflows/diag-hhkungfu.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Streamfree anti-devtools code
        run: |
          python3 <<'PY'
          import urllib.request,re
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          ref='https://streamfree.vip/embed/v/Dgh6TOLS'
          url='https://streamfree.vip/public/static/app.bb288bfe.js'
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':ref})
          js=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('LEN',len(js))
          terms=['(-3)','-3)','developer','devtools','debugger','outerWidth','innerWidth','outerHeight','innerHeight','console.clear','console.table','console.log','performance.now','Date.now','Firebug','toString','window.open','visibilityState']
          for term in terms:
              print('\n===',term,'===')
              start=0; count=0
              while count<20:
                  p=js.lower().find(term.lower(),start)
                  if p<0: break
                  print(js[max(0,p-1800):p+3500])
                  print('\n---')
                  start=p+len(term); count+=1
          # Look for Vietnamese strings and likely error codes.
          for pat in [r'vui.{0,80}nhà phát triển',r'tắt.{0,80}phát triển',r'\(-?3\)',r'\b-3\b']:
              print('\nPAT',pat)
              for m in list(re.finditer(pat,js,re.I))[:20]: print(js[max(0,m.start()-2000):m.start()+4000])
          PY
