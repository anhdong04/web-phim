name: Web Phim v6.4.1 Full Addon
on:
  push:
    paths:
      - 'v641_patch.js'
      - 'addon_v641.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/ci-v641.yml'
  workflow_dispatch:
jobs:
  full-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check v641_patch.js && node --check addon_v641.js
      - name: Full manifest regression
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('v641_patch.js','utf8');
          for (const needle of [
            "'/full/manifest.json'",
            "v620Hh3dStandaloneCatalog",
            "v620Hh3dStandaloneMeta",
            "v620Hh3dStandaloneStreams",
            "id: 'hh3d'",
            "let path = parsedBase.rest",
            "🎬 Web Phim Full",
            "6.4.1"
          ]) if (!s.includes(needle)) throw new Error('missing ' + needle);
          console.log('full HH3D merge assertions passed');
          NODE
      - name: Generated full addon smoke
        env:
          PORT: 7000
          HH3D_PIKPAK_ENABLED: 'false'
          YANHH3D_ENABLED: 'false'
        run: |
          node addon_v641.js >/tmp/v641.log 2>&1 &
          pid=$!
          ok=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7000/full/manifest.json >/tmp/full.json; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then cat /tmp/v641.log; exit 1; fi
          node <<'NODE'
          const j=require('/tmp/full.json');
          if (j.version !== '6.4.1') throw new Error('manifest version ' + j.version);
          if (j.name !== '🎬 Web Phim Full') throw new Error('manifest name ' + j.name);
          if (!Array.isArray(j.resources) || !j.resources.includes('catalog')) throw new Error('catalog resource missing');
          if (!Array.isArray(j.catalogs) || !j.catalogs.some(c => c.type === 'series' && c.id === 'hh3d')) throw new Error('HH3D catalog missing from Full manifest');
          const meta = j.resources.find(r => r && typeof r === 'object' && r.name === 'meta');
          const stream = j.resources.find(r => r && typeof r === 'object' && r.name === 'stream');
          if (!meta?.idPrefixes?.includes('hh3d:')) throw new Error('HH3D meta prefix missing');
          if (!stream?.idPrefixes?.includes('hh3d:')) throw new Error('HH3D stream prefix missing');
          NODE
          curl -fsS 'http://127.0.0.1:7000/full/catalog/series/hh3d.json' >/tmp/hh3d.json
          node <<'NODE'
          const j=require('/tmp/hh3d.json');
          if (!Array.isArray(j.metas)) throw new Error('HH3D Full catalog did not return metas array');
          NODE
          curl -fsS 'http://127.0.0.1:7000/full/catalog/series/yanhh3d.json' >/tmp/yan.json
          node <<'NODE'
          const j=require('/tmp/yan.json');
          if (!Array.isArray(j.metas)) throw new Error('YanHH3D Full catalog did not return metas array');
          NODE
          curl -fsS http://127.0.0.1:7000/full/manifest.json >/tmp/full-again.json
          kill -0 $pid
          kill $pid || true
