name: Web Phim v6.4.1 Full Addon
on:
  push:
    paths:
      - 'v641_patch.js'
      - 'addon_v641.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/ci-v641.yml'
  workflow_dispatch:
jobs:
  full-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check v641_patch.js && node --check addon_v641.js
      - name: Full manifest regression
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('v641_patch.js','utf8');
          for (const needle of [
            "'/full/manifest.json'",
            "startsWith('/full/')",
            "slice('/full'.length)",
            "🎬 Web Phim Full",
            "TMDB Việt + KKPhim + HH3D + YanHH3D",
            "6.4.1"
          ]) if (!s.includes(needle)) throw new Error('missing ' + needle);
          console.log('full addon base-path assertions passed');
          NODE
      - name: Generated full addon smoke
        env:
          PORT: 7000
          HH3D_PIKPAK_ENABLED: 'false'
          YANHH3D_ENABLED: 'false'
        run: |
          node addon_v641.js >/tmp/v641.log 2>&1 &
          pid=$!
          ok=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7000/full/manifest.json >/tmp/full.json; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then cat /tmp/v641.log; exit 1; fi
          node <<'NODE'
          const j=require('/tmp/full.json');
          if (j.version !== '6.4.1') throw new Error('manifest version ' + j.version);
          if (j.name !== '🎬 Web Phim Full') throw new Error('manifest name ' + j.name);
          if (!Array.isArray(j.resources) || !j.resources.includes('catalog')) throw new Error('catalog resource missing');
          NODE
          curl -fsS 'http://127.0.0.1:7000/full/catalog/movie/home-hot.json' >/tmp/catalog.json
          node <<'NODE'
          const j=require('/tmp/catalog.json');
          if (!Array.isArray(j.metas)) throw new Error('full catalog did not return metas array');
          NODE
          kill $pid || true
