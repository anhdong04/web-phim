name: Probe new Render domain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live routes
        shell: bash
        run: |
          set +e
          for u in \
            'https://web-phim-zwsx.onrender.com/manifest.json' \
            'https://web-phim-zwsx.onrender.com/hh4k/manifest.json' \
            'https://web-phim-zwsx.onrender.com/hh4k/diag'; do
            echo "=== $u ==="
            curl -L -i -sS --max-time 30 "$u" | head -c 12000
            echo
          done
